id: '3'
name: Password & Hash Attacks
icon: 🔑
color: red
description: Brute force, dictionary attacks, hash cracking, wordlist generation
tools:
- name: Hydra
  binary: hydra
  tagline: Fast Network Login Cracker — 50+ Protocols
  description: Fastest online password cracker. Supports SSH, FTP, HTTP, SMB, RDP,
    MySQL, SMTP, and 50+ more protocols.
  risk: high
  install: sudo apt install hydra -y
  syntax: hydra [options] target protocol
  flags:
  - flag: -l <user>
    description: Single username
  - flag: -L <file>
    description: Username list
  - flag: -p <pass>
    description: Single password
  - flag: -P <file>
    description: Password list
  - flag: -t <n>
    description: Parallel tasks (default 16)
  - flag: -s <port>
    description: Custom port
  - flag: -f
    description: Stop after first success
  - flag: -V
    description: Show each attempt
  - flag: -o <file>
    description: Output file
  examples:
  - description: SSH brute force
    command: hydra -l admin -P /usr/share/wordlists/rockyou.txt 192.168.1.1 ssh
  - description: FTP with user list
    command: hydra -L users.txt -P wordlist.txt 192.168.1.1 ftp
  - description: HTTP POST form
    command: hydra -l admin -P wordlist.txt 192.168.1.1 http-post-form '/login:user=^USER^&pass=^PASS^:Invalid'
  - description: RDP attack
    command: hydra -l administrator -P wordlist.txt 192.168.1.1 rdp
  - description: MySQL
    command: hydra -l root -P wordlist.txt 192.168.1.1 mysql
  - description: Custom port SSH
    command: hydra -l root -P wordlist.txt -s 2222 192.168.1.1 ssh
  tips:
  - Use -t 4 for SSH — higher causes connection resets
  - Inspect HTTP login in Burp Suite first to get correct POST format
  - Try default creds before launching full wordlist attacks
- name: John the Ripper
  binary: john
  tagline: Offline Password Hash Cracker
  description: Most popular offline hash cracker. Auto-detects hash types. Supports
    NTLM, MD5, SHA, Linux shadow, ZIP, SSH keys, and hundreds more.
  risk: medium
  install: sudo apt install john -y
  syntax: john [options] [hashfile]
  flags:
  - flag: --wordlist=<file>
    description: Wordlist attack
  - flag: --rules
    description: Apply mangling rules
  - flag: --format=<type>
    description: Force hash format
  - flag: --show
    description: Show cracked passwords
  - flag: --incremental
    description: Brute force mode
  - flag: --fork=<n>
    description: Use N CPU cores
  - flag: --list=formats
    description: List all formats
  examples:
  - description: Crack with rockyou
    command: john --wordlist=/usr/share/wordlists/rockyou.txt hashes.txt
  - description: Linux shadow file
    command: john --wordlist=wordlist.txt /etc/shadow
  - description: NTLM hashes
    command: john --format=NT --wordlist=wordlist.txt hashes.txt
  - description: Crack ZIP password
    command: zip2john archive.zip > zip.hash && john zip.hash
  - description: Crack SSH key
    command: ssh2john id_rsa > rsa.hash && john rsa.hash
  - description: Show cracked
    command: john --show hashes.txt
  tips:
  - zip2john, ssh2john, pdf2john convert non-standard formats
  - unshadow /etc/passwd /etc/shadow > combined.txt for Linux cracking
  - For GPU cracking use hashcat — john is CPU-only
- name: Hashcat
  binary: hashcat
  tagline: World's Fastest GPU Password Cracker
  description: GPU-accelerated hash cracker. Supports 300+ hash types. 100x-1000x
    faster than CPU-only tools for same hash type.
  risk: medium
  install: sudo apt install hashcat -y
  syntax: hashcat -m <type> -a <mode> hashfile wordlist
  flags:
  - flag: -m <type>
    description: Hash type ID
  - flag: -a <mode>
    description: 'Attack mode: 0=dict, 3=brute, 6=hybrid'
  - flag: -r <rules>
    description: Rule file
  - flag: -o <file>
    description: Output cracked hashes
  - flag: --show
    description: Show cracked
  - flag: --force
    description: Force on VM/no GPU
  - flag: -w <1-4>
    description: Workload 1=low 4=max
  examples:
  - description: Crack MD5
    command: hashcat -m 0 -a 0 hash.txt /usr/share/wordlists/rockyou.txt
  - description: Crack NTLM (Windows)
    command: hashcat -m 1000 -a 0 ntlm.txt rockyou.txt
  - description: Crack WPA2 handshake
    command: hashcat -m 22000 -a 0 capture.hc22000 rockyou.txt
  - description: Crack SHA-256
    command: hashcat -m 1400 -a 0 sha256.txt rockyou.txt
  - description: Brute force 6-char
    command: hashcat -m 0 -a 3 hash.txt ?a?a?a?a?a?a
  - description: With best64 rules
    command: hashcat -m 0 -a 0 -r /usr/share/hashcat/rules/best64.rule hash.txt rockyou.txt
  tips:
  - 'Hash IDs: 0=MD5, 100=SHA1, 1000=NTLM, 1400=SHA256, 1800=SHA512crypt, 22000=WPA2'
  - 'Mask: ?l=lower, ?u=upper, ?d=digit, ?s=symbol, ?a=all'
  - --force needed in VMs where no GPU detected
