id: '11'
name: Steganography & Covert Ops
icon: 🎭
color: bright_magenta
description: Data hiding, cryptographic carrier encapsulation, digital watermarking, and defensive steganalysis
tools:
- name: StegoForge
  binary: stegoforge
  tagline: Universal Multimedia Steganography & Concealment Engine
  description: Modular steganography & AEAD encryption platform supporting lossless images (PNG, BMP, GIF), lossy JPEG (DCT), uncompressed WAV audio, PDF/OOXML documents, ZIP extra-fields, and EOF append with Argon2id + AES-256-GCM / ChaCha20 protection.
  risk: low
  install: pip install -e /path/to/stegoforge
  syntax: stegoforge [command] [options]
  flags:
  - flag: embed -i <carrier> -m <method> -c <cipher> --payload-file <file>
    description: Embed protected payload into carrier media
  - flag: extract -i <stego_file> -o <out_file>
    description: Extract and authenticate hidden payload
  - flag: analyze -i <carrier>
    description: Analyze carrier format and calculate live capacities
  - flag: recommend -c <carrier> -s <bytes>
    description: Explainable algorithm recommender & pre-flight capacity check
  - flag: --compress <auto|deflate|lzma|bzip2|none>
    description: Pre-encryption compression algorithm
  - flag: --multi-payload <file1> <file2>
    description: Package and conceal multiple payloads into single carrier
  examples:
  - description: Interactive TUI Wizard
    command: stegoforge
  - description: Embed file with AES-256-GCM + Argon2id
    command: stegoforge embed -i carrier.png -m lsb-spatial -c aes-256-gcm --payload-file secret.pdf -o stego.png
  - description: Extract payload from stego carrier
    command: stegoforge extract -i stego.png -o recovered.pdf
  - description: Pre-flight capacity & algorithm recommendation
    command: stegoforge recommend -c carrier.png -s 5000
  - description: Carrier capacity analysis
    command: stegoforge analyze -i carrier.wav
  tips:
  - Always check capacity before embedding to ensure payload fits without truncation.
  - Multi-payload bundling automatically packages files with SHA-256 integrity verification.
  - Compression occurs before encryption for maximum efficiency.

- name: StegoForge Steganalysis
  binary: stegoforge
  tagline: Defensive Forensics & Statistical Entropy Scanner
  description: Defensive cybersecurity steganalysis tool. Analyzes global and sliding-block Shannon entropy, Chi-Square (Pairs of Values) LSB distribution, trailing unreferenced EOF bytes, known steganographic signatures, and generates risk scores (0-100).
  risk: low
  install: pip install -e /path/to/stegoforge
  syntax: stegoforge steganalysis -i <file>
  flags:
  - flag: -i <file>
    description: Target carrier or suspicious file to analyze
  examples:
  - description: Full forensic steganalysis scan
    command: stegoforge steganalysis -i suspicious.png
  - description: Inspect potential stego document
    command: stegoforge steganalysis -i invoice.pdf
  tips:
  - Shannon entropy > 7.92 bits/byte in non-compressed regions indicates encrypted/hidden data.
  - High suspicion score indicates presence of known steganography envelopes or trailing EOF payloads.

- name: StegoForge Watermark
  binary: stegoforge
  tagline: Cryptographic Digital Watermarking & Asset Authenticity
  description: Signs digital assets with HMAC-SHA256 owner signatures, timestamps, and metadata to verify authenticity, track provenance, and detect tampering.
  risk: low
  install: pip install -e /path/to/stegoforge
  syntax: stegoforge watermark [embed|verify] [options]
  flags:
  - flag: embed -i <carrier> --owner <name> -k <secret_key>
    description: Embed signed digital watermark into asset
  - flag: verify -i <watermarked_file> -k <secret_key>
    description: Verify digital watermark signature and detect tampering
  - flag: --desc <text>
    description: Optional copyright or asset description metadata
  examples:
  - description: Embed cryptographic watermark
    command: stegoforge watermark embed -i asset.png --owner "CyberBlack Ops" -k "SuperSecretKey123"
  - description: Verify asset authenticity
    command: stegoforge watermark verify -i watermarked_asset.png -k "SuperSecretKey123"
  tips:
  - Watermarking is separate from hidden payload storage and focuses on authenticity verification.
  - Any tampering with the asset invalidates the HMAC signature during verification.

- name: StegoForge Research Lab
  binary: stegoforge
  tagline: Steganography Algorithm Benchmark & Quality Matrix
  description: Runs automated comparative benchmarks across all compatible steganographic methods for a carrier. Measures capacity, embedding throughput, extraction latency, PSNR (dB), SSIM, and visual distortion.
  risk: low
  install: pip install -e /path/to/stegoforge
  syntax: stegoforge lab -c <carrier_file>
  flags:
  - flag: -c <carrier>
    description: Carrier media file to benchmark
  examples:
  - description: Benchmark image steganography algorithms
    command: stegoforge lab -c cover.png
  - description: Benchmark audio steganography algorithms
    command: stegoforge lab -c sample.wav
  tips:
  - PSNR > 45 dB and SSIM > 0.999 indicate imperceptible visual distortion.
  - Compares spatial LSB, transform-domain DCT, audio sample modulation, and structural techniques.

- name: Steghide
  binary: steghide
  tagline: Classic Image & Audio Steganography
  description: Hides data in BMP, JPEG, WAV, and AU files using graph-theoretic embedding and Rijndael-128 / Blowfish encryption.
  risk: low
  install: sudo apt install steghide -y
  syntax: steghide [embed|extract|info] [options]
  flags:
  - flag: embed -cf <cover> -ef <secret>
    description: Embed secret file into cover media
  - flag: extract -sf <stego_file>
    description: Extract secret file from stego media
  - flag: info <file>
    description: Inspect stego file for embedded capacity
  examples:
  - description: Embed text in JPEG
    command: steghide embed -cf image.jpg -ef secret.txt
  - description: Extract data
    command: steghide extract -sf image.jpg
  tips:
  - Steghide modifies DCT coefficients for JPEG and sample values for WAV.

- name: OpenStego
  binary: openstego
  tagline: Java Data Hiding & Watermarking Suite
  description: Open-source steganography application providing data hiding (randomized LSB) and digital watermarking (signature embedding).
  risk: low
  install: sudo apt install openstego -y
  syntax: openstego [embed|extract] [options]
  flags:
  - flag: embed -mf <msg> -cf <cover> -sf <output>
    description: Hide message inside cover image
  - flag: extract -sf <stego> -xd <out_dir>
    description: Extract hidden payload to directory
  examples:
  - description: Embed payload
    command: openstego embed -mf secret.zip -cf cover.png -sf output.png
  - description: Extract payload
    command: openstego extract -sf output.png -xd ./extracted/
  tips:
  - Uses plugin-based algorithm architecture for data hiding and watermarking.

- name: Zsteg
  binary: zsteg
  tagline: PNG & BMP LSB Steganography Carving Tool
  description: Ruby tool for detecting and extracting hidden data in PNG and BMP files across various LSB, MSB, and color channel combinations.
  risk: low
  install: gem install zsteg
  syntax: zsteg [options] <image.png>
  flags:
  - flag: -a
    description: Try all known methods and combinations
  - flag: -E <payload>
    description: Extract specific payload format
  examples:
  - description: Scan image with all methods
    command: zsteg -a image.png
  - description: Extract prime LSB payload
    command: zsteg -e b1,rgb,lsb,xy image.png -> output.bin
  tips:
  - Excellent for CTF steganography challenges and forensic analysis of lossless images.
