[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberblack"
version = "2.2.0"
description = "Enterprise-Grade CEH, OSINT, Pentesting & Steganography Toolkit"
authors = [{name = "CyberBlack"}]
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "questionary>=2.0.0",
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
]

[project.scripts]
cyberblack = "cyberblack.cli:main"

[project.entry-points."stegoforge.methods"]
eof_append = "cyberblack.stegoforge.methods.generic.eof_append:EofAppendMethod"
lsb_spatial = "cyberblack.stegoforge.methods.image.lsb_spatial:LsbSpatialMethod"
dct_jpeg = "cyberblack.stegoforge.methods.image.dct_jpeg:DctJpegMethod"
lsb_sample = "cyberblack.stegoforge.methods.audio.lsb_sample:LsbSampleMethod"
echo_hide = "cyberblack.stegoforge.methods.audio.echo_hide:EchoHideMethod"
phase_coding = "cyberblack.stegoforge.methods.audio.phase_coding:PhaseCodingMethod"
whitespace = "cyberblack.stegoforge.methods.text.whitespace:WhitespaceMethod"
zero_width = "cyberblack.stegoforge.methods.text.zero_width:ZeroWidthMethod"
pdf_metadata = "cyberblack.stegoforge.methods.documents.pdf_metadata:PdfMetadataMethod"
ooxml_part = "cyberblack.stegoforge.methods.documents.ooxml_part:OoxmlPartMethod"
zip_extrafield = "cyberblack.stegoforge.methods.archive.zip_extrafield:ZipExtraFieldMethod"

[project.entry-points."stegoforge.ciphers"]
aes_gcm = "cyberblack.stegoforge.ciphers.aes_gcm:AesGcmCipher"
chacha20 = "cyberblack.stegoforge.ciphers.chacha20:ChaCha20Cipher"
base64_enc = "cyberblack.stegoforge.ciphers.encoding_only:Base64Encoding"
base85_enc = "cyberblack.stegoforge.ciphers.encoding_only:Base85Encoding"
xor = "cyberblack.stegoforge.ciphers.cipher_lab.xor_cipher:XorCipher"
caesar = "cyberblack.stegoforge.ciphers.cipher_lab.caesar:CaesarCipher"
vigenere = "cyberblack.stegoforge.ciphers.cipher_lab.vigenere:VigenereCipher"
rail_fence = "cyberblack.stegoforge.ciphers.cipher_lab.rail_fence:RailFenceCipher"

[tool.setuptools.packages.find]
include = ["cyberblack*", "stegoforge*"]

[tool.setuptools.package-data]
cyberblack = ["data/categories/*.yaml", "stegoforge/docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
